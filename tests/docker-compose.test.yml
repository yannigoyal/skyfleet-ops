services:
  # Deliberately publishes no host port. Playwright reaches this service over the
  # internal Compose network (BASE_URL below), and the healthcheck curls the app
  # from inside its own container, so a host mapping buys the suite nothing while
  # colliding with the production container scripts/start_mac.sh leaves bound to
  # host port 8000. To reach this app from a host browser while debugging, add a
  # mapping to an unused host port locally, e.g. ports: ["8001:8000"].
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      LLM_MOCK: "true"
      OPENROUTER_API_KEY: "test-key-not-used-in-mock-mode"
    # Probes with python3, not curl: the app image is python:3.12-slim based and
    # ships no curl, so a curl probe can never exit 0 and the service never turns
    # healthy — which would strand the playwright service on its service_healthy
    # condition forever.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import sys, urllib.request; sys.exit(0 if urllib.request.urlopen("http://localhost:8000/api/health", timeout=3).status == 200 else 1)
      interval: 5s
      timeout: 3s
      retries: 10

  playwright:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    working_dir: /e2e
    volumes:
      - .:/e2e
    environment:
      BASE_URL: "http://app:8000"
    depends_on:
      app:
        condition: service_healthy
    command: sh -c "npm install && npx playwright test"
